[project]
name = "trmm-web-relay"
version = "0.3.0"
description = "Weboberflächen in Kundennetzen bei Bedarf öffnen, über Tactical RMM und einen Sprung-Host"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Thorsten Spille", email = "thorsten@spille-edv.de" }]
readme = "README.md"
dependencies = ["keyring>=24"]

[project.urls]
Homepage = "https://code.bashclub.org/bashclub/trmm-web-relay"
Documentation = "https://docs.bashclub.org/s/trmm-web-relay"

[project.scripts]
trmm-web-relay = "trmmwebrelay.cli:main"

[project.gui-scripts]
# Unter Windows ohne Konsolenfenster (für Verknüpfungen)
trmm-web-relay-gui = "trmmwebrelay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trmmwebrelay"]

[tool.hatch.build.targets.wheel.force-include]
# Agent-Skripte (für die Einrichtung) und Sprung-Host (für den Installer)
"trmm-scripts" = "trmmwebrelay/data/trmm-scripts"
"jumphost" = "trmmwebrelay/data/jumphost"
